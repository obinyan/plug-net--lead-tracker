<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<div id="app"></div>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :root{
    --bg:#000000;
    --panel:#121212;
    --panel-2:#1c1c1c;
    --line:#2e2e2e;
    --text:#ffffff;
    --muted:#999999;
    --signal:#270E83;
    --signal-dim:#4a2fc9;
    --ok:#ffffff;
    --warn:#bfbfbf;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  #app{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    width:100%;
    padding:28px 24px 60px;
  }
  .wrap{width:100%;}
  .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .brand-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text);text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:var(--mono);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .stats{display:flex;gap:18px;font-family:var(--mono);}
  .stat{text-align:right;}
  .stat .n{font-size:20px;font-weight:700;}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

  .scope-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .scope-toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;}
  .scope-btn{
    font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    padding:7px 16px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;
  }
  .scope-btn.active{background:var(--signal);color:#ffffff;}
  .region-select{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;
  }
  .region-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  select,input[type=text]{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:6px;font-family:var(--sans);font-size:13px;
  }
  button{
    background:var(--signal);color:#ffffff;border:none;padding:8px 14px;border-radius:6px;
    font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;
  }
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  button:hover{opacity:.9;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:12px;
  }
  .card-main{min-width:0;}
  .name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .name{font-weight:600;font-size:15px;}
  .niche-tag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.05em;}
  .meta{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5;}
  .meta a{color:var(--muted);}
  .contact-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .inline-input{
    flex:1;min-width:140px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:var(--sans);
  }
  .notes{
    width:100%;margin-top:8px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);border-radius:6px;padding:8px;font-size:12.5px;font-family:var(--sans);resize:vertical;min-height:32px;
  }
  .card-side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:150px;}
  .status-select{width:100%;}
  .status-pill{
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    padding:3px 8px;border-radius:20px;border:1px solid var(--line);
  }
  .status-New{color:var(--signal);border-color:var(--signal-dim);}
  .status-Contacted{color:var(--warn);}
  .status-Replied{color:#e0e0e0;}
  .status-Qualified{color:var(--ok);}
  .status-Closed{color:var(--muted);}
  .del{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;text-decoration:underline;}

  .add-form{
    background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:16px 18px;margin-bottom:20px;
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .add-form input, .add-form select{width:100%;}
  .add-form .full{grid-column:1/-1;}
  .add-form-title{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;grid-column:1/-1;margin-bottom:2px;}

  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px;}
  .loading{color:var(--muted);text-align:center;padding:40px 0;font-family:var(--mono);font-size:13px;}

  .lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .lock-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px 28px;width:100%;max-width:340px;}
  .lock-input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:6px;font-family:var(--sans);font-size:14px;
  }
  .pw-input-wrap{position:relative;display:flex;align-items:center;}
  .pw-input-wrap .lock-input{padding-right:40px;}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);font-size:16px;padding:4px 6px;cursor:pointer;line-height:1;
  }
  .pw-toggle:hover{opacity:.8;}
</style>

function StatusPill({status}){
  return <span className={`status-pill status-${status}`}>{status}</span>;
}

function App(){
  const [authed,setAuthed] = useState(false);
  const [pwInput,setPwInput] = useState("");
  const [pwError,setPwError] = useState(false);
  const [networkError,setNetworkError] = useState(false);
  const [apiError,setApiError] = useState("");
  const [checkingAuth,setCheckingAuth] = useState(true);
  const [showPw,setShowPw] = useState(false);
  const [leads,setLeads] = useState(null);
  const [scope,setScope] = useState("local");
  const [region,setRegion] = useState("Lagos");
  const [filterNiche,setFilterNiche] = useState("All");
  const [filterStatus,setFilterStatus] = useState("All");
  const [showForm,setShowForm] = useState(false);
  const [form,setForm] = useState({name:"",niche:"",phone:"",email:"",website:"",address:"",rating:"",notes:"",followUp:""});
  const [saveError,setSaveError] = useState(false);
  const [selected,setSelected] = useState({});

  function changeScope(newScope){
    setScope(newScope);
    setRegion(REGIONS[newScope][0]);
    setSelected({});
  }

  function toggleSelect(id){
    setSelected(prev => ({...prev, [id]: !prev[id]}));
  }

  function selectAllVisible(ids, checked){
    setSelected(prev => {
      const next = {...prev};
      ids.forEach(id => next[id] = checked);
      return next;
    });
  }

  function csvEscape(val){
    const s = (val===undefined || val===null) ? "" : String(val);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function exportSelected(list){
    const cols = ["name","niche","scope","region","phone","email","website","address","rating","status","followUp","notes"];
    const headerLabels = ["Name","Niche","Scope","Region","Phone","Email","Website","Address","Rating","Status","Follow-up Date","Notes"];
    const rows = [headerLabels.join(",")];
    list.forEach(l => {
      rows.push(cols.map(c => csvEscape(l[c])).join(","));
    });
    const csvContent = rows.join("\n");
    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `leads-export-${dateStamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function authHeaders(){
    const pw = sessionStorage.getItem("sitePassword") || "";
    return {"Content-Type":"application/json", "x-site-password": pw};
  }

  async function loadLeads(){
    try{
      const r = await fetch("/api/leads", {headers: authHeaders()});
      if(r.status===401){
        sessionStorage.removeItem("sitePassword");
        setAuthed(false);
        setCheckingAuth(false);
        return;
      }
      const data = await r.json();
      setLeads((data && data.leads) ? data.leads : SEED_LEADS);
      setAuthed(true);
      setCheckingAuth(false);
    }catch(e){
      setLeads(SEED_LEADS);
      setAuthed(true);
      setCheckingAuth(false);
    }
  }

  useEffect(()=>{
    const stored = sessionStorage.getItem("sitePassword");
    if(stored===null){
      setCheckingAuth(false);
      return;
    }
    loadLeads();
  },[]);

  async function submitPassword(){
    sessionStorage.setItem("sitePassword", pwInput);
    setPwError(false);
    setNetworkError(false);
    setApiError("");
    setCheckingAuth(true);
    try{
      const r = await fetch("/api/leads", {headers: authHeaders()});
      let data = null;
      try{ data = await r.json(); }catch(parseErr){ data = null; }

      if(r.status===401){
        sessionStorage.removeItem("sitePassword");
        setPwError(true);
        setCheckingAuth(false);
        return;
      }
      if(!r.ok){
        sessionStorage.removeItem("sitePassword");
        setApiError((data && data.error) ? data.error : `Server error (status ${r.status}). Check Vercel function logs.`);
        setCheckingAuth(false);
        return;
      }
      setLeads((data && data.leads) ? data.leads : SEED_LEADS);
      setAuthed(true);
      setCheckingAuth(false);
    }catch(e){
      sessionStorage.removeItem("sitePassword");
      setNetworkError(true);
      setCheckingAuth(false);
    }
  }

  async function persist(next){
    setLeads(next);
    try{
      const r = await fetch("/api/leads", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(next)
      });
      if(r.status===401){
        sessionStorage.removeItem("sitePassword");
        setAuthed(false);
        return;
      }
      setSaveError(!r.ok);
    }catch(e){
      setSaveError(true);
    }
  }

  function updateLead(id, patch){
    const next = leads.map(l => l.id===id ? {...l, ...patch} : l);
    persist(next);
  }

  function deleteLead(id){
    persist(leads.filter(l => l.id!==id));
  }

  function addLead(){
    if(!form.name.trim()) return;
    const next = [{
      id: "l"+Date.now(),
      name: form.name.trim(),
      niche: form.niche.trim() || "Other",
      scope: scope,
      region: region,
      phone: form.phone.trim(),
      email: form.email.trim(),
      website: form.website.trim(),
      address: form.address.trim(),
      rating: form.rating.trim(),
      status: "New",
      notes: form.notes.trim(),
      followUp: form.followUp.trim(),
    }, ...leads];
    persist(next);
    setForm({name:"",niche:"",phone:"",email:"",website:"",address:"",rating:"",notes:"",followUp:""});
    setShowForm(false);
  }

  const scopeLeads = useMemo(()=>{
    if(!leads) return [];
    return leads.filter(l => l.scope===scope && l.region===region);
  },[leads,scope,region]);

  const niches = useMemo(()=>{
    return ["All", ...Array.from(new Set(scopeLeads.map(l=>l.niche)))];
  },[scopeLeads]);

  const filtered = useMemo(()=>{
    const list = scopeLeads.filter(l =>
      (filterNiche==="All" || l.niche===filterNiche) &&
      (filterStatus==="All" || l.status===filterStatus)
    );
    return [...list].sort((a,b)=>{
      const af = a.followUp || "9999-99-99";
      const bf = b.followUp || "9999-99-99";
      return af.localeCompare(bf);
    });
  },[scopeLeads,filterNiche,filterStatus]);

  const counts = useMemo(()=>{
    const c = {};
    STATUSES.forEach(s => c[s] = scopeLeads.filter(l=>l.status===s).length);
    return c;
  },[scopeLeads]);

  if(checkingAuth){
    return <div className="loading">checking access…</div>;
  }

  if(!authed){
    return (
      <div className="lock-wrap">
        <div className="lock-card">
          <div className="brand-eyebrow">// PlugNet Web Enterprise lead_pipeline</div>
          <h1 style={{marginBottom:14}}>Enter password</h1>
          <div className="pw-input-wrap">
            <input
              type={showPw ? "text" : "password"}
              className="lock-input"
              placeholder="Site password"
              value={pwInput}
              onChange={e=>setPwInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") submitPassword(); }}
              autoFocus
            />
            <button
              type="button"
              className="pw-toggle"
              onClick={()=>setShowPw(!showPw)}
              aria-label={showPw ? "Hide password" : "Show password"}
            >
              {showPw ? "🙈" : "👁"}
            </button>
          </div>
          <button style={{marginTop:10,width:"100%"}} onClick={submitPassword}>Unlock</button>
          {pwError && <div style={{color:"var(--signal)",fontSize:12,marginTop:8}}>Incorrect password — try again.</div>}
          {networkError && <div style={{color:"var(--signal)",fontSize:12,marginTop:8}}>Connection hiccup — please try again.</div>}
          {apiError && <div style={{color:"var(--signal)",fontSize:12,marginTop:8}}>{apiError}</div>}
        </div>
      </div>
    );
  }

  if(leads===null){
    return <div className="loading">loading leads…</div>;
  }

  return (
    <div className="wrap">
      <div className="top">
        <div>
          <div className="brand-eyebrow">// PlugNet Web Enterprise lead_pipeline</div>
          <h1>Client Pipeline</h1>
          <div className="sub">Ecommerce &amp; retail leads · {scope==="local" ? "Local" : "International"} · {region}</div>
        </div>
        <div className="stats">
          <div className="stat"><div className="n">{scopeLeads.length}</div><div className="l">total</div></div>
          <div className="stat"><div className="n" style={{color:"var(--signal)"}}>{counts.New||0}</div><div className="l">new</div></div>
          <div className="stat"><div className="n" style={{color:"var(--ok)"}}>{counts.Qualified||0}</div><div className="l">qualified</div></div>
        </div>
      </div>

      <div className="scope-bar">
        <div className="scope-toggle">
          <button className={`scope-btn ${scope==="local"?"active":""}`} onClick={()=>changeScope("local")}>Local</button>
          <button className={`scope-btn ${scope==="international"?"active":""}`} onClick={()=>changeScope("international")}>International</button>
        </div>
        <div>
          <span className="region-label">{scope==="local" ? "State: " : "Location: "}</span>
          <select className="region-select" value={region} onChange={e=>setRegion(e.target.value)}>
            {REGIONS[scope].map(r => <option key={r} value={r}>{r}</option>)}
          </select>
        </div>
      </div>

      <div className="toolbar">
        <select value={filterNiche} onChange={e=>setFilterNiche(e.target.value)}>
          {niches.map(n => <option key={n} value={n}>{n}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="All">All statuses</option>
          {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <button className="ghost" onClick={()=>setShowForm(!showForm)}>{showForm ? "Cancel" : "+ Add lead"}</button>
        <span style={{flex:1}}></span>
        <label style={{fontSize:12,color:"var(--muted)",display:"flex",alignItems:"center",gap:5}}>
          <input
            type="checkbox"
            checked={filtered.length>0 && filtered.every(l=>selected[l.id])}
            onChange={e=>selectAllVisible(filtered.map(l=>l.id), e.target.checked)}
          />
          select all shown
        </label>
        <button
          onClick={()=>{
            const toExport = leads.filter(l=>selected[l.id]);
            if(toExport.length===0) return;
            exportSelected(toExport);
          }}
        >
          Export selected ({Object.values(selected).filter(Boolean).length}) to CSV
        </button>
      </div>

      {showForm &&
        <div className="add-form">
          <div className="add-form-title">New lead · adding to {scope==="local"?"Local":"International"} / {region}</div>
          <input type="text" placeholder="Business name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
          <input type="text" placeholder="Niche (e.g. Fashion/Retail)" value={form.niche} onChange={e=>setForm({...form,niche:e.target.value})}/>
          <input type="text" placeholder="Phone" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/>
          <input type="text" placeholder="Email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/>
          <input type="text" placeholder="Website (leave blank if none found)" value={form.website} onChange={e=>setForm({...form,website:e.target.value})}/>
          <input type="text" placeholder="Address" value={form.address} onChange={e=>setForm({...form,address:e.target.value})}/>
          <input type="text" placeholder="Rating (optional)" value={form.rating} onChange={e=>setForm({...form,rating:e.target.value})}/>
          <input type="text" placeholder="Notes (site issues, angle, etc.)" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          <div>
            <label style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",display:"block",marginBottom:4}}>Follow-up date</label>
            <input type="date" style={{width:"100%"}} value={form.followUp} onChange={e=>setForm({...form,followUp:e.target.value})}/>
          </div>
          <div className="full"><button onClick={addLead}>Save lead</button></div>
        </div>
      }

      {filtered.length===0 && <div className="empty">No leads match this filter for {region}.</div>}

      {filtered.map(l => (
        <div className="card" key={l.id}>
          <div className="card-main">
            <div className="name-row">
              <input
                type="checkbox"
                checked={!!selected[l.id]}
                onChange={()=>toggleSelect(l.id)}
                style={{marginRight:2}}
              />
              <span className="name">{l.name}</span>
              <span className="niche-tag">{l.niche}</span>
            </div>
            <div className="meta">
              {l.phone && <span>{l.phone} · </span>}
              {l.address && <span>{l.address}</span>}
              {l.rating && <span> · ★ {l.rating}</span>}
            </div>
            <div className="contact-row">
              <input
                type="text"
                className="inline-input"
                placeholder="Email"
                value={l.email||""}
                onChange={e=>updateLead(l.id,{email:e.target.value})}
              />
              <input
                type="text"
                className="inline-input"
                placeholder="Website (e.g. https://...)"
                value={l.website||""}
                onChange={e=>updateLead(l.id,{website:e.target.value})}
              />
            </div>
            <textarea
              className="notes"
              placeholder="Notes: site issues found, pitch angle, follow-up date..."
              value={l.notes}
              onChange={e=>updateLead(l.id, {notes:e.target.value})}
            />
          </div>
          <div className="card-side">
            <StatusPill status={l.status}/>
            <select className="status-select" value={l.status} onChange={e=>updateLead(l.id,{status:e.target.value})}>
              {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <div style={{width:"100%"}}>
              <label style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",display:"block",marginBottom:2}}>Follow up</label>
              <input
                type="date"
                style={{
                  width:"100%",
                  borderColor: (l.followUp && l.followUp <= todayStr && l.status!=="Closed") ? "var(--signal)" : "var(--line)"
                }}
                value={l.followUp||""}
                onChange={e=>updateLead(l.id,{followUp:e.target.value})}
              />
              {l.followUp && l.followUp <= todayStr && l.status!=="Closed" &&
                <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--signal)",marginTop:3}}>due</div>
              }
            </div>
            <button className="del" onClick={()=>deleteLead(l.id)}>remove</button>
          </div>
        </div>
      ))}

      {saveError && <div className="empty">Couldn't save changes right now — your edits are visible but may not persist. Try again in a moment.</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</body></html>
